<!DOCTYPE html>
<html>
<head>
    <title>Rowspan and Colspan</title>
    <style>
        th {
            font-size: large;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h2>GROCERY DETAILS:</h2>
    <table style="border-color:blueviolet" border="1" cellpadding="2">
        <thead>
        <tr>
            <th rowspan="2">Sr no.</th>
            <th colspan="3">Category</th>
            <th colspan="2" >Item</th>
            <th rowspan="2">Quantity</th>
            <th rowspan="2">Price</th>
        </tr>
        <tr>
            <th >Fruits</th>
            <th>Veggies</th>
            <th>Others</th>
            <th>Name</th>
            <th>Image</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1.</td>
            <td><i>&#x2714;</i></td>
            <td></td>
            <td></td>
            <td>Apple</td>
            <td><img src="https://images.pexels.com/photos/9280417/pexels-photo-9280417.jpeg" height="30px" width="42px"></td>
            <td>2<b>kg</b></td>
            <td>200</td>
        </tr>
        <tr>
            <td>2.</td>
            <td></td>
            <td><i>&#x2714;</i></td>
            <td></td>
            <td>Onion</td>
            <td><img src="https://images.pexels.com/photos/4163410/pexels-photo-4163410.jpeg" height="30px" width="42px"></td>
            <td>4<b>kg</b></td>
            <td>400</td>
        </tr>
        <tr>
            <td>3.</td>
            <td></td>
            <td></td>
            <td><i>&#x2714;</i></td>
            <td>Salad</td>
            <td><img src="https://images.pexels.com/photos/16723207/pexels-photo-16723207.jpeg" height="30px" width="42px"></td>
            <td>7<b>kg</b></td>
            <td>800</td>
        </tr>
        <tr>
            <td>4.</td>
            <td><i>&#x2714;</i></td>
            <td></td>
            <td></td>
            <td>Orange</td>
            <td><img src="https://images.pexels.com/photos/7960508/pexels-photo-7960508.jpeg" height="30px" width="42px"></td>
            <td>1<b>kg</b></td>
            <td>100</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td style="text-align:end;" colspan="8"><b>Total Price</b>Rs.1500</td>
        </tr>
        </tfoot>
    </table>

</body>
</html>
